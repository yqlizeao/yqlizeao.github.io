# Site settings
locale: zh
lang: zh
title: 胶卷的缤纷世界
subtitle: 胶卷印象的博客 | Leo Blog
description: "Game Developer，热爱渲染，希望自己也能写出绚丽的特效"
url: "https://yqlizeao.55555.io"
baseurl: ""
repository: "yqlizeao/yqlizeao.github.io"
email: yqlizeao@foxmail.com
minimal_mistakes_skin: default
title_separator: "|"

# Theme
remote_theme: "mmistakes/minimal-mistakes"

# SEO & analytics
keywords: ["Unity3D", "UnrealEngine", "Shader"]
collections:
  posts:
    output: true

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "UA-106151904-1"
    anonymize_ip: false

# Localization
timezone: Asia/Shanghai

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"
search: true
search_full_content: true

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Author
author:
  name: Leo
  avatar: "/img/touxiang.jpg"
  bio: "用心积累，成长进步。学习是一辈子的事情。"
  location: "China"
  links:
    - label: Email
      icon: "fas fa-envelope"
      url: "mailto:yqlizeao@foxmail.com"
    - label: GitHub
      icon: "fab fa-github"
      url: "https://github.com/yqlizeao"
    - label: Weibo
      icon: "fab fa-weibo"
      url: "https://weibo.com/yqlizeao"
    - label: Zhihu
      icon: "fab fa-zhihu"
      url: "https://www.zhihu.com/people/yqlizeao"
    - label: Twitter
      icon: "fab fa-twitter"
      url: "https://twitter.com/yqlizeao"

# Global header
header:
  overlay_image: "/img/main.jpg"
  overlay_filter: 0.35

# Excludes
exclude:
  - less
  - node_modules
  - Gruntfile.js
  - package.json
  - README.zh.md
  - README.md
  - vendor
