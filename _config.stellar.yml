# Stellar v2 configuration
# Docs: https://xaoxuu.com/wiki/stellar/

leftbar:
  enabled: true
  brand:
    name: Leo's Blog
    tagline: Game Developer
    image:
      src: /img/touxiang.jpg
      variant: avatar
    search: true
    ghuser: yqlizeao
  menu_columns: 2
  menu:
    - id: post
      title: 文章
      icon: default:documents
      url: /
    - id: wiki
      title: 知识库
      icon: default:notebook
      url: /wiki/
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
  footer:
    actions:
      - type: link
        title: GitHub
        icon: default:github
        url: https://github.com/yqlizeao
      - type: link
        title: 关于作者
        icon: default:profile
        url: /about/
footer:
  sitemap:
    - title: 博客
      items:
        - '[近期文章](/)'
        - '[文章归档](/archives/)'
        - '[全部分类](/categories/)'
        - '[所有标签](/tags/)'
    - title: 关于与联系
      items:
        - '[关于作者](/about/)'
        - '[GitHub 主页](https://github.com/yqlizeao)'
  content: ''

article:
  style: tech
  paragraph_indent: auto
  banner:
    background: true
  listing:
    card_layout: hero
    pinned_layout: carousel
    show_tags: true
  show_reading_time: true
  footer:
    license: false
    share: []

profiles:
  home:
    leftbar:
      widgets:
        - welcome
        - recent
        - tagcloud
  post:
    rightbar:
      widgets:
        - toc
  wiki:
    leftbar:
      widgets:
        - tree
        - related
    rightbar:
      widgets:
        - ghrepo
        - toc
appearance:
  preset: card
  shape:
    corner: superellipse(1.25)
  backgrounds:
    leftbar:
      type: gradient
    page:
      backdrop:
        radius: 100px
        saturation: 300%
  color_scheme: auto

features:
  color_scheme_switch:
    enabled: true
  card_hover:
    spotlight: true
    tilt: true
  reveal:
    enabled: true

search:
  provider: local
  local:
    scope: all
    include_content: true

comments:
  provider: giscus
  giscus:
    data-repo: yqlizeao/yqlizeao.github.io
    data-repo-id: MDEwOlJlcG9zaXRvcnkxMDIzNzI3NjI=
    data-category: General
    data-category-id: DIC_kwDOBhoVms4DHUQe
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: bottom
    data-theme: preferred_color_scheme
    data-lang: zh-CN

inject:
  head_end: '<style>.highlight.shaderlab .code:before, .highlight.hlsl .code:before { content: "ShaderLab"; } .highlight.csharp .code:before { content: "C#"; }</style>'
